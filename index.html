<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17233c">
  <title>Spiral Stamp Maker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="workbench">
    <header class="masthead">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <div>
        <p class="kicker">CLIP STUDIO / TRANSPARENT PNG TOOL</p>
        <h1>Spiral Stamp Maker</h1>
      </div>
      <p class="edition">製図机 01</p>
    </header>

    <div class="desk">
      <form id="controls" class="control-panel">
        <div class="panel-heading"><span>01</span><h2>全体設定</h2></div>
        <p class="panel-note">螺旋の共通線を調整します。</p>

        <label class="field">出力サイズ
          <select id="size">
            <option value="512">512 × 512 px</option>
            <option value="1024" selected>1024 × 1024 px</option>
            <option value="2048">2048 × 2048 px</option>
          </select>
        </label>
        <label class="field color-field">線の色
          <span class="color-control"><input id="color" type="color" value="#17233c"><output>#17233C</output></span>
        </label>
        <label class="field">不透明度
          <span class="range-line"><input id="opacity" type="range" min=".05" max="1" step=".05" value="1"><output data-output-for="opacity">100%</output></span>
        </label>
        <label class="field">線幅
          <span class="range-line"><input id="lineWidth" type="range" min="1" max="48" step="1" value="8"><output data-output-for="lineWidth">8 px</output></span>
        </label>
        <label class="field">間隔
          <span class="range-line"><input id="spacing" type="range" min="4" max="160" step="1" value="36"><output data-output-for="spacing">36 px</output></span>
        </label>
        <label class="field">回転数
          <span class="range-line"><input id="turns" type="range" min="1" max="40" step=".5" value="15"><output data-output-for="turns">15 回</output></span>
        </label>
        <label class="field">開始半径
          <span class="range-line"><input id="startRadius" type="range" min="0" max="300" step="1" value="6"><output data-output-for="startRadius">6 px</output></span>
        </label>

        <div class="panel-heading layer-heading"><span>02</span><h2>レイヤー</h2></div>
        <p class="panel-note">複数追加すると、同じ線幅の螺旋が重なり一つの流れになります。</p>
        <div id="layers" class="layers"></div>
        <button id="addSpiral" type="button" class="button secondary">＋ スパイラルを追加</button>
        <button id="download" type="button" class="button primary">透過PNGを保存</button>
        <p class="registration-note">クリスタでは画像素材、またはブラシ先端形状として登録できます。</p>
      </form>

      <section class="preview-area" aria-labelledby="preview-title">
        <div class="preview-topline"><div><p class="kicker">LIVE PREVIEW</p><h2 id="preview-title">作業面</h2></div><span class="size-badge">1024 px</span></div>
        <div class="canvas-wrap">
          <canvas id="preview" width="1024" height="1024" aria-label="螺旋スタンプのプレビュー"></canvas>
          <span class="axis axis-x" aria-hidden="true">X</span><span class="axis axis-y" aria-hidden="true">Y</span>
        </div>
        <div class="preview-footer"><span>透明部分は市松模様で表示</span><span>中心 50 / 50</span></div>
        <p id="status" class="status" aria-live="polite">準備完了 — スパイラルを追加して調整できます。</p>
      </section>
    </div>
  </main>

  <template id="spiralTemplate">
    <article class="layer" data-layer>
      <div class="layer-title"><strong>スパイラル <span data-layer-number>01</span></strong><button type="button" class="remove" data-action="remove" aria-label="このスパイラルを削除">削除</button></div>
      <label class="field compact">中心 X
        <span class="range-line"><input data-field="centerX" type="range" min="0" max="100" step="1" value="50"><output>50%</output></span>
      </label>
      <label class="field compact">中心 Y
        <span class="range-line"><input data-field="centerY" type="range" min="0" max="100" step="1" value="50"><output>50%</output></span>
      </label>
      <label class="field compact">回転
        <span class="range-line"><input data-field="rotation" type="range" min="-180" max="180" step="1" value="0"><output>0°</output></span>
      </label>
      <label class="field compact">位相
        <span class="range-line"><input data-field="phase" type="range" min="0" max="360" step="1" value="0"><output>0°</output></span>
      </label>
    </article>
  </template>
  <script type="module" src="./app.js"></script>
</body>
</html>
